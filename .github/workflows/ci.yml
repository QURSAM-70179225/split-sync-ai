name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t splitsync-ai .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e SEED_DEMO_ON_START=true splitsync-ai
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          curl -sf localhost:8000/api/groups | grep -q 'Bali'
