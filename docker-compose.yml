# One command: docker compose up --build   ->  http://localhost:8080
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - splitsync-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  splitsync-data:
